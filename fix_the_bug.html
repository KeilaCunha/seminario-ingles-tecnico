<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fix the Bug — English Tenses Debugger</title>
<style>
  :root{
    --bg:#1e1e1e; --sidebar:#252526; --tabsbar:#2d2d2d; --activeTab:#1e1e1e;
    --border:#3c3c3c; --text:#d4d4d4; --muted:#8a8a8a;
    --accent:#0e639c; --accent2:#1177bb; --green:#4ec9a0; --red:#f14c4c;
    --kw:#569cd6; --str:#ce9178; --com:#6a9955; --fn:#dcdcaa; --num:#b5cea8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#0a0a0a;font-family:'Consolas','Courier New',monospace;color:var(--text);overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100vh;}

  .titlebar{
    background:#323233;height:34px;display:flex;align-items:center;padding:0 12px;
    border-bottom:1px solid var(--border);flex-shrink:0;
  }
  .dots{display:flex;gap:8px;margin-right:16px;flex-shrink:0;}
  .dot{width:12px;height:12px;border-radius:50%;}
  .dot.red{background:#ff5f56;} .dot.yellow{background:#ffbd2e;} .dot.green{background:#27c93f;}
  .titlebar-text{font-size:12px;color:var(--muted);flex:1;text-align:center;margin-right:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hamburger-btn{
    display:none;background:none;border:none;color:#fff;font-size:18px;
    margin-right:10px;cursor:pointer;padding:2px 8px;flex-shrink:0;
  }

  .main-layout{flex:1;display:flex;min-height:0;position:relative;}

  .sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39;}
  .sidebar-backdrop.hidden{display:none;}

  .sidebar{
    width:230px;background:var(--sidebar);border-right:1px solid var(--border);
    display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;
  }
  .sidebar-title{font-size:11px;color:var(--muted);padding:14px 16px 8px;letter-spacing:1px;text-transform:uppercase;}
  .sidebar-project{font-size:12px;color:#cccccc;padding:2px 12px 10px;font-weight:bold;display:flex;align-items:center;gap:6px;}
  .file-item{
    display:flex;align-items:center;gap:8px;padding:8px 12px 8px 24px;cursor:pointer;
    font-size:13px;color:#cccccc;border-left:2px solid transparent;
  }
  .file-item:hover{background:#2a2d2e;}
  .file-item.active{background:#37373d;}
  .ext-badge{
    width:18px;height:18px;border-radius:3px;font-size:9px;font-weight:bold;
    display:flex;align-items:center;justify-content:center;color:#1e1e1e;flex-shrink:0;
  }
  .status-dot{width:8px;height:8px;border-radius:50%;background:#5a5a5a;margin-left:auto;flex-shrink:0;}
  .status-dot.done{background:var(--green);box-shadow:0 0 6px var(--green);}
  .file-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .sidebar-footer{margin-top:auto;padding:14px 16px;border-top:1px solid var(--border);}
  .progress-label{font-size:11px;color:var(--muted);margin-bottom:6px;}
  .progress-track{height:6px;background:#3c3c3c;border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,#0e639c,#4ec9a0);width:0%;transition:width .4s ease;}

  .editor-area{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}

  .tabs{display:flex;background:var(--tabsbar);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;}
  .tab{
    display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;font-size:13px;
    color:var(--muted);border-right:1px solid var(--border);cursor:pointer;white-space:nowrap;
    background:var(--tabsbar);
  }
  .tab.active{background:var(--activeTab);color:#fff;border-top:2px solid var(--accent2);}
  .tab .ext-badge{width:16px;height:16px;font-size:8px;}
  .tab-close{opacity:.6;padding:0 2px;border-radius:3px;}
  .tab-close:hover{background:#5a5a5a;opacity:1;}

  .editor{flex:1;overflow-y:auto;background:var(--bg);padding:14px 0;-webkit-overflow-scrolling:touch;}
  .empty-editor{color:var(--muted);text-align:center;margin-top:80px;font-size:13px;padding:0 20px;}
  .code-line{display:flex;font-size:14px;line-height:22px;padding:0 16px;}
  .code-line:hover{background:#2a2a2a;}
  .line-num{width:36px;text-align:right;color:#5a5a5a;user-select:none;margin-right:18px;flex-shrink:0;}
  .line-content{white-space:pre-wrap;word-break:break-word;flex:1;}

  .tok-kw{color:var(--kw);} .tok-str{color:var(--str);} .tok-com{color:var(--com);}
  .tok-fn{color:var(--fn);} .tok-num{color:var(--num);} .tok-pl{color:var(--text);}

  .bug-word{
    color:var(--com);cursor:pointer;position:relative;
    text-decoration:underline;text-decoration-style:wavy;text-decoration-color:var(--red);
    text-underline-offset:3px;
  }
  .bug-word:hover{background:rgba(241,76,76,.12);}
  .bug-word.shake{animation:shake .35s;}
  @keyframes shake{
    0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }
  .fixed-word{color:var(--green);background:rgba(78,201,160,.12);border-radius:3px;padding:0 2px;}
  .fixed-check{color:var(--green);margin-left:6px;font-size:12px;}

  .bottom-panel{height:150px;border-top:1px solid var(--border);background:#181818;flex-shrink:0;display:flex;flex-direction:column;}
  .panel-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
  .panel-tab{padding:6px 14px;font-size:11px;letter-spacing:.5px;color:var(--muted);cursor:pointer;text-transform:uppercase;}
  .panel-tab.active{color:#fff;border-bottom:2px solid var(--accent2);}
  .panel-content{flex:1;overflow-y:auto;padding:8px 14px;font-size:12.5px;-webkit-overflow-scrolling:touch;}
  #problemsPanel .prob-line{color:#e8ab53;margin:3px 0;}
  #problemsPanel .ok-line{color:var(--green);margin:3px 0;}
  #terminalPanel{color:#c8c8c8;}
  #terminalPanel .log-ok{color:var(--green);}
  #terminalPanel .log-err{color:var(--red);}
  #terminalPanel .log-info{color:#569cd6;}
  #terminalPanel div{margin:2px 0;}

  .statusbar{
    height:24px;background:var(--accent);display:flex;align-items:center;
    justify-content:space-between;padding:0 12px;font-size:12px;flex-shrink:0;color:#fff;overflow:hidden;
  }
  .statusbar .sb-left, .statusbar .sb-right{display:flex;min-width:0;}
  .statusbar span{margin-right:16px;display:flex;align-items:center;gap:5px;white-space:nowrap;}

  /* Quick fix popup */
  #quickfix-popup{
    position:fixed;background:#252526;border:1px solid #454545;border-radius:4px;
    box-shadow:0 4px 16px rgba(0,0,0,.5);z-index:50;width:270px;max-width:88vw;
    font-size:13px;overflow:hidden;
  }
  #quickfix-popup.hidden{display:none;}
  .qf-header{background:#2d2d2d;padding:6px 12px;color:var(--muted);font-size:11px;border-bottom:1px solid #3c3c3c;}
  .qf-option{padding:10px 12px;cursor:pointer;color:var(--text);border-bottom:1px solid #303030;}
  .qf-option:last-child{border-bottom:none;}
  .qf-option:hover{background:var(--accent2);color:#fff;}
  .qf-option.wrong-flash{background:var(--red)!important;color:#fff!important;}

  .toast{
    position:fixed;bottom:180px;right:24px;background:#252526;border:1px solid var(--green);
    border-left:4px solid var(--green);padding:10px 16px;border-radius:4px;font-size:12.5px;
    box-shadow:0 4px 14px rgba(0,0,0,.5);max-width:360px;z-index:60;opacity:0;
    transform:translateY(10px);transition:all .3s ease;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  /* Overlay success */
  #overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;
    justify-content:center;z-index:100;flex-direction:column;padding:16px;
  }
  #overlay.hidden{display:none;}
  #confetti-canvas{position:absolute;inset:0;pointer-events:none;}
  .success-box{
    position:relative;background:#181818;border:1px solid #333;border-radius:8px;
    padding:36px 48px;text-align:center;max-width:600px;width:100%;z-index:2;
  }
  .success-box .prompt{color:var(--green);font-size:13px;text-align:left;margin-bottom:18px;min-height:110px;}
  .success-box h1{color:#fff;font-size:26px;margin:10px 0;}
  .success-box .grade{font-size:48px;font-weight:bold;color:var(--green);margin:10px 0;}
  .success-box p{color:var(--muted);font-size:14px;}
  .restart-btn{
    margin-top:18px;background:var(--accent2);color:#fff;border:none;padding:10px 24px;
    border-radius:4px;cursor:pointer;font-size:14px;font-family:inherit;
  }
  .restart-btn:hover{background:#1a8cd8;}
  .cursor-blink{display:inline-block;width:7px;height:14px;background:var(--green);animation:blink 1s step-end infinite;vertical-align:middle;}
  @keyframes blink{50%{opacity:0;}}

  /* ---------- Responsive: tablet / mobile ---------- */
  @media (max-width: 860px){
    .hamburger-btn{display:inline-block;}
    .titlebar-text{margin-right:8px;}

    .sidebar{
      position:fixed;top:34px;bottom:0;left:-260px;width:250px;z-index:40;
      transition:left .25s ease;box-shadow:2px 0 16px rgba(0,0,0,.6);
    }
    .sidebar.open{left:0;}

    .bottom-panel{height:120px;}
    .panel-content{font-size:12px;padding:8px 10px;}

    .code-line{font-size:13px;line-height:20px;padding:0 10px;}
    .line-num{width:24px;margin-right:10px;}

    .statusbar{font-size:11px;padding:0 8px;}
    .statusbar span{margin-right:8px;}
    .hide-mobile{display:none!important;}

    .toast{left:12px;right:12px;bottom:132px;max-width:none;}

    .success-box{padding:26px 20px;}
    .success-box .prompt{font-size:11.5px;min-height:90px;}
    .success-box h1{font-size:20px;}
    .success-box .grade{font-size:38px;}
  }

  @media (max-width: 420px){
    .titlebar-text{display:none;}
    .code-line{font-size:12.5px;}
    .file-item{font-size:12.5px;}
    .tab{font-size:12px;padding:8px 8px 8px 10px;}
  }
</style>
</head>
<body>

<div id="app">
  <div class="titlebar">
    <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Abrir menu">?</button>
    <div class="dots"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
    <div class="titlebar-text">fix-the-bug — english-tenses-debugger</div>
  </div>

  <div class="main-layout">
    <div class="sidebar-backdrop hidden" id="sidebarBackdrop" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-title">Explorer</div>
      <div class="sidebar-project">?? seminario-ingles-tecnico</div>
      <div id="fileList"></div>
      <div class="sidebar-footer">
        <div class="progress-label" id="progressLabel">Bugs corrigidos: 0 / 10</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>

    <div class="editor-area">
      <div class="tabs" id="tabs"></div>
      <div class="editor" id="editor"></div>
      <div class="bottom-panel">
        <div class="panel-tabs">
          <div class="panel-tab active" data-panel="problems" id="tabProblems">Problems</div>
          <div class="panel-tab" data-panel="terminal" id="tabTerminal">Terminal</div>
        </div>
        <div class="panel-content" id="problemsPanel"></div>
        <div class="panel-content" id="terminalPanel" style="display:none;"></div>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <div class="sb-left">
      <span>?? main</span>
      <span id="statusLang">Plain Text</span>
    </div>
    <div class="sb-right">
      <span id="statusScore">?? 0 / 10</span>
      <span class="hide-mobile">UTF-8</span>
    </div>
  </div>
</div>

<div id="quickfix-popup" class="hidden">
  <div class="qf-header">?? Quick Fix... corrija o tempo verbal</div>
  <div id="qfOptions"></div>
</div>

<div id="overlay" class="hidden">
  <canvas id="confetti-canvas"></canvas>
  <div class="success-box">
    <div class="prompt" id="terminalTyping"></div>
    <h1>? BUILD SUCCEEDED</h1>
    <div class="grade" id="finalGrade">—</div>
    <p id="finalDetails"></p>
    <button class="restart-btn" onclick="location.reload()">? Rodar novamente</button>
  </div>
</div>

<script>
const EXT_COLORS = { js:'#f1e05a', py:'#3572A5', c:'#5c6bc0', yml:'#cb171e' };
const MOBILE_BREAKPOINT = 860;

function seg(t,c){ return {t,c}; }
function bug(t,options,correct,explain){ return {t,c:'bug',options,correct,explain}; }

const FILES = [
  { name:'server.js', ext:'js', lang:'JavaScript', lines:[
    [seg('// This function ','com'), bug('is process',['is process','processes','process','are processing'],1,
      'Comportamento padrão da função, não uma ação pontual ? Simple Present. Sujeito é "this function" (it) ? acrescenta -s: processes.'), seg(' incoming requests and returns a response.','com')],
    [seg('function ','kw'), seg('handleRequest','tok-fn'), seg('(req, res) {','pl')],
    [seg('  const data = ','pl'), seg('processData','tok-fn'), seg('(req.body);','pl')],
    [seg('  res.send(data);','pl')],
    [seg('}','pl')]
  ]},
  { name:'algorithm.py', ext:'py', lang:'Python', lines:[
    [seg('# The quicksort algorithm sorts the array by choosing a pivot element.','com')],
    [seg('# Right now, ','com'), bug('it divide',['it divide','it divides','it is dividing','it was dividing'],2,
      '"Right now" indica uma ação em andamento no momento da fala ? Present Continuous: it is dividing.'), seg(' the list into two sublists.','com')],
    [seg('def ','kw'), seg('quicksort','tok-fn'), seg('(arr):','pl')],
    [seg('    if len(arr) <= 1:','pl')],
    [seg('        return arr','kw')]
  ]},
  { name:'backup.py', ext:'py', lang:'Python', lines:[
    [seg('# The database backup runs every night at midnight.','com')],
    [seg('# Currently, ','com'), bug('the system upload',['the system upload','the system uploads','the system is uploading','the system was uploading'],2,
      '"Currently" indica uma ação em progresso agora ? Present Continuous: the system is uploading.'), seg(' the backup file to the cloud.','com')],
    [seg('def ','kw'), seg('run_backup','tok-fn'), seg('():','pl')],
    [seg('    connection = ','pl'), seg('connect_to_db','tok-fn'), seg('()','pl')]
  ]},
  { name:'network.c', ext:'c', lang:'C', lines:[
    [seg('// The socket listens for incoming connections on port 8080.','com')],
    [seg('// At this moment, the client ','com'), bug('is send',['is send','is sending','send','sends'],1,
      '"At this moment" ? ação em andamento agora ? Present Continuous: is sending.'), seg(' a large file to the server.','com')],
    [seg('int ','kw'), seg('main','tok-fn'), seg('() {','pl')],
    [seg('    int socket_fd = socket(AF_INET, SOCK_STREAM, 0);','pl')],
    [seg('    return 0;','kw')],
    [seg('}','pl')]
  ]},
  { name:'api.js', ext:'js', lang:'JavaScript', lines:[
    [seg('// This endpoint usually returns a JSON object with user data.','com')],
    [seg('// TODO: ','com'), bug('the team fix',['the team fix','the team fixes','the team are fixing','the team fixing'],1,
      '"Every sprint" indica rotina/hábito ? Simple Present. "Team" é tratado como singular (it) ? acrescenta -s: fixes.'), seg(' this bug every sprint.','com')],
    [seg('app.get','tok-fn'), seg("('/users', (req, res) => {",'pl')],
    [seg('  res.json(users);','pl')],
    [seg('});','pl')]
  ]},
  { name:'cache.py', ext:'py', lang:'Python', lines:[
    [seg('# The cache stores frequently accessed data to improve performance.','com')],
    [seg('# It usually ','com'), bug('take',['take','takes','is taking','taking'],1,
      '"Usually" é advérbio de frequência típico do Simple Present. Sujeito "it" (3ª pessoa singular) ? acrescenta -s: takes.'), seg(' less than 10 milliseconds to respond.','com')],
    [seg('def ','kw'), seg('get_from_cache','tok-fn'), seg('(key):','pl')],
    [seg('    return cache.get(key)','kw')]
  ]},
  { name:'auth.js', ext:'js', lang:'JavaScript', lines:[
    [seg('// The authentication service verifies tokens on every request.','com')],
    [seg('// Security logs ','com'), bug('shows',['shows','show','is showing','are showed'],1,
      '"Logs" é plural (they) ? sem -s no Simple Present: show, e não shows.'), seg(' every failed login attempt.','com')],
    [seg('function ','kw'), seg('verifyToken','tok-fn'), seg('(token) {','pl')],
    [seg('  return jwt.verify(token, SECRET);','pl')],
    [seg('}','pl')]
  ]},
  { name:'loop.py', ext:'py', lang:'Python', lines:[
    [seg('# This loop iterates over each element in the list.','com')],
    [seg('# Wait, the counter ','com'), bug("doesn't increasing",["doesn't increasing","isn't increasing","don't increase","not increase"],1,
      'Estamos observando o comportamento agora ("Wait...") ? Present Continuous negativo: isn\'t increasing (to be + not + verbo-ing).'), seg(' correctly.','com')],
    [seg('for ','kw'), seg('i ','pl'), seg('in ','kw'), seg('range(len(items)):','pl')],
    [seg('    counter += 1','pl')]
  ]},
  { name:'deploy.yml', ext:'yml', lang:'YAML', lines:[
    [seg('# This pipeline usually ','com'), bug('deploy',['deploy','deploys','is deploying','deploying'],1,
      '"Usually" ? rotina/hábito ? Simple Present. Sujeito "pipeline" (it) ? acrescenta -s: deploys.'), seg(' the app to production after tests pass.','com')],
    [seg('# Right now, the pipeline is failing because of a missing dependency.','com')],
    [seg('name: ','kw'), seg('Deploy Pipeline','str')],
    [seg('on: ','kw'), seg('[push]','pl')]
  ]},
  { name:'monitor.py', ext:'py', lang:'Python', lines:[
    [seg('# The monitoring dashboard displays real-time metrics.','com')],
    [seg('# Currently, three servers are running at high CPU usage.','com')],
    [seg('# ','com'), bug('Everything are working',['Everything are working','Everything is working','Everything work','Everything working'],1,
      '"Everything" é sempre tratado como singular ? usa "is", nunca "are": Everything is working.'), seg(' as expected.','com')],
    [seg('def ','kw'), seg('check_status','tok-fn'), seg('():','pl')],
    [seg('    return "OK"','str')]
  ]}
];

let openTabs = [];
let activeTab = -1;
let fixedCount = 0;
let currentContext = null;
let activePanel = 'problems';

function tokClass(c){
  if(c==='tok-fn') return 'tok-fn';
  if(c==='kw'||c==='com'||c==='str'||c==='num'||c==='pl') return 'tok-'+c;
  return 'tok-pl';
}

function isMobile(){ return window.innerWidth <= MOBILE_BREAKPOINT; }

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBackdrop').classList.toggle('hidden');
}
function closeSidebarOnMobile(){
  if(isMobile()){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarBackdrop').classList.add('hidden');
  }
}

function renderSidebar(){
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  FILES.forEach((f,i)=>{
    const div = document.createElement('div');
    div.className = 'file-item' + (activeTab===i?' active':'');
    div.onclick = ()=>openFile(i);
    div.innerHTML = `
      <span class="ext-badge" style="background:${EXT_COLORS[f.ext]}">${f.ext.slice(0,2).toUpperCase()}</span>
      <span class="file-name">${f.name}</span>
      <span class="status-dot ${f.solved?'done':''}"></span>`;
    list.appendChild(div);
  });
  document.getElementById('progressLabel').textContent = `Bugs corrigidos: ${fixedCount} / ${FILES.length}`;
  document.getElementById('progressFill').style.width = (fixedCount/FILES.length*100)+'%';
  document.getElementById('statusScore').textContent = `?? ${fixedCount} / ${FILES.length}`;
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  openTabs.forEach(i=>{
    const f = FILES[i];
    const tab = document.createElement('div');
    tab.className = 'tab' + (activeTab===i?' active':'');
    tab.onclick = ()=>{ activeTab=i; renderAll(); };
    tab.innerHTML = `
      <span class="ext-badge" style="background:${EXT_COLORS[f.ext]}">${f.ext.slice(0,2).toUpperCase()}</span>
      <span>${f.name}</span>
      <span class="tab-close" onclick="event.stopPropagation();closeTab(${i})">?</span>`;
    tabsEl.appendChild(tab);
  });
}

function closeTab(i){
  openTabs = openTabs.filter(x=>x!==i);
  if(activeTab===i){
    activeTab = openTabs.length ? openTabs[openTabs.length-1] : -1;
  }
  renderAll();
}

function openFile(i){
  if(!openTabs.includes(i)) openTabs.push(i);
  activeTab = i;
  renderAll();
  closeSidebarOnMobile();
}

function renderEditor(){
  const editor = document.getElementById('editor');
  if(activeTab===-1){
    editor.innerHTML = '<div class="empty-editor">Selecione um arquivo no Explorer para encontrar o bug de gramática ?</div>';
    document.getElementById('statusLang').textContent = 'Plain Text';
    return;
  }
  const f = FILES[activeTab];
  document.getElementById('statusLang').textContent = f.lang;
  let html = '';
  f.lines.forEach((line, lineIdx)=>{
    html += `<div class="code-line"><span class="line-num">${lineIdx+1}</span><span class="line-content">`;
    line.forEach((s, segIdx)=>{
      if(s.c==='bug'){
        if(f.solved){
          html += `<span class="fixed-word">${f.fixedText}</span><span class="fixed-check">?</span>`;
        } else {
          html += `<span class="bug-word" data-line="${lineIdx}" data-seg="${segIdx}" onclick="openQuickFix(event,${lineIdx},${segIdx})">${s.t}</span>`;
        }
      } else {
        html += `<span class="${tokClass(s.c)}">${s.t}</span>`;
      }
    });
    html += `</span></div>`;
  });
  editor.innerHTML = html;
}

function renderProblemsPanel(){
  const panel = document.getElementById('problemsPanel');
  if(activeTab===-1){ panel.innerHTML=''; return; }
  const f = FILES[activeTab];
  if(f.solved){
    panel.innerHTML = `<div class="ok-line">? Nenhum problema encontrado em ${f.name}. Tempo verbal correto!</div>`;
  } else {
    panel.innerHTML = `<div class="prob-line">? 1 problema: possível erro de tempo verbal em um comentário de ${f.name}. Toque na palavra sublinhada em vermelho.</div>`;
  }
}

function renderAll(){
  renderSidebar();
  renderTabs();
  renderEditor();
  renderProblemsPanel();
}

function log(msg, cls){
  const panel = document.getElementById('terminalPanel');
  const div = document.createElement('div');
  div.className = cls || '';
  const time = new Date().toLocaleTimeString('pt-BR',{hour12:false});
  div.textContent = `[${time}] ${msg}`;
  panel.appendChild(div);
  panel.scrollTop = panel.scrollHeight;
}

document.getElementById('tabProblems').onclick = ()=>switchPanel('problems');
document.getElementById('tabTerminal').onclick = ()=>switchPanel('terminal');
function switchPanel(p){
  activePanel = p;
  document.getElementById('tabProblems').classList.toggle('active', p==='problems');
  document.getElementById('tabTerminal').classList.toggle('active', p==='terminal');
  document.getElementById('problemsPanel').style.display = p==='problems' ? 'block' : 'none';
  document.getElementById('terminalPanel').style.display = p==='terminal' ? 'block' : 'none';
}

function openQuickFix(evt, lineIdx, segIdx){
  const f = FILES[activeTab];
  if(f.solved) return;
  const seg = f.lines[lineIdx][segIdx];
  currentContext = {lineIdx, segIdx};
  const popup = document.getElementById('quickfix-popup');
  const optsEl = document.getElementById('qfOptions');
  optsEl.innerHTML = '';
  const shuffled = seg.options.map((opt,idx)=>({opt,idx})).sort(()=>Math.random()-0.5);
  shuffled.forEach(({opt,idx})=>{
    const div = document.createElement('div');
    div.className = 'qf-option';
    div.textContent = opt;
    div.onclick = ()=>chooseOption(idx, div);
    optsEl.appendChild(div);
  });

  const rect = evt.target.getBoundingClientRect();
  popup.classList.remove('hidden');
  const popupWidth = popup.offsetWidth;
  const popupHeight = popup.offsetHeight;

  let left = rect.left;
  if(left + popupWidth > window.innerWidth - 8) left = window.innerWidth - popupWidth - 8;
  if(left < 8) left = 8;

  let top = rect.bottom + 6;
  if(top + popupHeight > window.innerHeight - 8){
    top = rect.top - popupHeight - 6;
    if(top < 8) top = 8;
  }

  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
}

function chooseOption(idx, el){
  const f = FILES[activeTab];
  const {lineIdx, segIdx} = currentContext;
  const seg = f.lines[lineIdx][segIdx];
  if(idx === seg.correct){
    f.solved = true;
    f.fixedText = seg.options[idx];
    fixedCount++;
    document.getElementById('quickfix-popup').classList.add('hidden');
    log(`Corrigido em ${f.name}: "${seg.options[idx]}" ? — ${seg.explain}`, 'log-ok');
    showToast(`? Corrigido! ${seg.explain}`);
    renderAll();
    if(fixedCount === FILES.length){
      setTimeout(showSuccessOverlay, 900);
    }
  } else {
    f.attempts = (f.attempts||0)+1;
    el.classList.add('wrong-flash');
    const bugSpan = document.querySelector(`.bug-word[data-line="${lineIdx}"][data-seg="${segIdx}"]`);
    if(bugSpan){ bugSpan.classList.add('shake'); setTimeout(()=>bugSpan.classList.remove('shake'),350); }
    log(`Tentativa incorreta em ${f.name}. Ainda há um erro de tempo verbal na linha ${lineIdx+1}.`, 'log-err');
    setTimeout(()=>el.classList.remove('wrong-flash'), 350);
  }
}

document.addEventListener('click', (e)=>{
  const popup = document.getElementById('quickfix-popup');
  if(!popup.classList.contains('hidden') && !popup.contains(e.target) && !e.target.classList.contains('bug-word')){
    popup.classList.add('hidden');
  }
});

let toastTimer = null;
function showToast(msg){
  let toast = document.getElementById('activeToast');
  if(toast) toast.remove();
  toast = document.createElement('div');
  toast.id = 'activeToast';
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  requestAnimationFrame(()=>toast.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toast.classList.remove('show'); setTimeout(()=>toast.remove(),300); }, 4200);
}

/* ---------- Success overlay + confetti ---------- */
function showSuccessOverlay(){
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hidden');
  const totalAttempts = FILES.reduce((s,f)=>s+(f.attempts||0),0);
  const perfect = FILES.filter(f=>!f.attempts).length;
  let gradeLetter = 'A+';
  if(totalAttempts>2 && totalAttempts<=5) gradeLetter='A';
  else if(totalAttempts>5 && totalAttempts<=9) gradeLetter='B';
  else if(totalAttempts>9) gradeLetter='C';
  document.getElementById('finalGrade').textContent = gradeLetter;
  document.getElementById('finalDetails').textContent =
    `${perfect} / ${FILES.length} bugs corrigidos na primeira tentativa — ${totalAttempts} erro(s) no total.`;

  const lines = [
    '$ npm run build',
    '> compiling grammar rules...',
    '> checking simple present / present continuous...',
    '> running test suite... 10/10 passed',
    ''
  ];
  const typingEl = document.getElementById('terminalTyping');
  typingEl.innerHTML = '';
  let li = 0;
  function typeLine(){
    if(li>=lines.length) return;
    const div = document.createElement('div');
    typingEl.appendChild(div);
    let text = lines[li]; let ci = 0;
    const interval = setInterval(()=>{
      div.innerHTML = text.slice(0,ci+1) + '<span class="cursor-blink"></span>';
      ci++;
      if(ci>=text.length){
        clearInterval(interval);
        div.innerHTML = text;
        li++;
        setTimeout(typeLine, 180);
      }
    }, 22);
  }
  typeLine();
  startConfetti();
}

function startConfetti(){
  const canvas = document.getElementById('confetti-canvas');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#4ec9a0','#569cd6','#dcdcaa','#ce9178','#f14c4c','#c586c0'];
  const count = window.innerWidth < 500 ? 80 : 140;
  const pieces = Array.from({length:count}, ()=>({
    x: Math.random()*canvas.width,
    y: -20 - Math.random()*canvas.height,
    size: 5+Math.random()*6,
    speed: 2+Math.random()*3,
    drift: (Math.random()-0.5)*2,
    color: colors[Math.floor(Math.random()*colors.length)],
    rot: Math.random()*360,
    rotSpeed: (Math.random()-0.5)*10
  }));
  let frame=0;
  function loop(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.y += p.speed; p.x += p.drift; p.rot += p.rotSpeed;
      if(p.y > canvas.height+20){ p.y = -20; p.x = Math.random()*canvas.width; }
      ctx.save();
      ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      ctx.restore();
    });
    if(frame<600) requestAnimationFrame(loop);
  }
  loop();
}

window.addEventListener('resize', ()=>{
  const canvas = document.getElementById('confetti-canvas');
  if(!document.getElementById('overlay').classList.contains('hidden')){
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  }
});

renderAll();
openFile(0);
</script>
